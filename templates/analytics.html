{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<div class="analytics-page">
    <div class="analytics-card">
        <div class="analytics-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        </div>

        <span class="analytics-badge">Coming Soon</span>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-desc">
            We're working on powerful insights and visualizations to help you understand your spending patterns better.
        </p>

        <div class="analytics-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <p class="analytics-tagline">We're crafting something special</p>
    </div>
</div>
{% endblock %}
